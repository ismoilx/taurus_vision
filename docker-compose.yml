# ============================================================================
# Taurus Vision - Full Stack Orchestration
# Sprint 15-16: celery_training servisi va training_data volume qo'shildi
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: taurus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taurus
      POSTGRES_PASSWORD: taurus123
      POSTGRES_DB: taurus_vision
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taurus -d taurus_vision"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taurus-network

  redis:
    image: redis:7-alpine
    container_name: taurus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taurus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-backend
    restart: unless-stopped
    environment:
      APP_NAME: "Taurus Vision API"
      APP_VERSION: "0.1.0"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "https://zxzx.uz", "https://api.zxzx.uz", "https://taurus.zxzx.uz"]'
      SECRET_KEY: "${SECRET_KEY}"
      INITIAL_ADMIN_EMAIL: "admin@taurus.uz"
      INITIAL_ADMIN_USERNAME: "admin"
      INITIAL_ADMIN_PASSWORD: "Admin1234"
      INITIAL_ADMIN_FULLNAME: "System Administrator"
      ML_MODEL_PATH: "/app/ml/models"
      # YOLO26 — Ultralytics 2025-yil sentabr (NMS-free, 43% tezroq CPU)
      YOLO_MODEL: "yolo26n.pt"
      # Muzzle detection: custom trained best.pt
      MUZZLE_MODEL: "best.pt"
      MUZZLE_STRICT_MODE: "true"
      MUZZLE_CONFIDENCE_THRESHOLD: "0.40"
      TRAINING_FRAMES_DIR: "/app/data/training/frames"
      TRAINING_DATASETS_DIR: "/app/data/training/datasets"
      TRAINING_MODELS_DIR: "/app/data/training/models"
      TRAINING_BASE_MODEL_PATH: "/app/ml/models/yolo26n.pt"
      TRAINING_DEPLOY_MODEL_PATH: "/app/ml/models/yolo_custom.pt"
      TRAINING_COLLECT_EVERY_N: "50"
      TRAINING_MIN_DETECTIONS: "2"
      TRAINING_MAX_PER_CAMERA: "500"
      TRAINING_MAX_TOTAL: "5000"
      TRAINING_JPEG_QUALITY: "90"
      TRAINING_COLLECTION_ENABLED: "true"
      # Health prediction ML modellari — RF + IsolationForest diskka saqlanadi
      PREDICTION_MODELS_DIR: "/app/ml/models/prediction"
      # ── Telegram Notification Bot ─────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_IDS: "${TELEGRAM_CHAT_IDS}"
    # ── Webcam / USB kamera uchun device mount ────────────────────────────────
    # Host mashinadagi /dev/video* qurilmalar container ichiga ko'rinadi.
    # Faqat mavjud qurilmalar ko'rsatiladi — bo'lmasa compose ishlamaydi.
    # Agar boshqa index kerak bo'lsa (masalan /dev/video2) qo'shing.
    # devices:
    #   - /dev/video0:/dev/video0
    # "video" guruhi OpenCV uchun /dev/video* ga kirish huquqini beradi
    # group_add:
    #   - video
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/ml:/app/ml
      - ./backend/tests:/app/tests
      - backend_data:/app/data
      - ./data/videos:/app/data/videos
      # Named volume ishlatiladi — bind mount UID/permission muammosini hal qiladi.
      # Host papkasi kerak bo'lsa: `docker cp taurus-backend:/app/data/training ./data/training`
      - training_data:/app/data/training
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - taurus-network
    command: >
      sh -c "
        mkdir -p /app/data/training/frames /app/data/training/datasets /app/data/training/models
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    mem_limit: 2g
    memswap_limit: 2g

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      TRAINING_FRAMES_DIR: "/app/data/training/frames"
      TRAINING_DATASETS_DIR: "/app/data/training/datasets"
      TRAINING_MODELS_DIR: "/app/data/training/models"
    volumes:
      - ./backend/app:/app/app
      - ./backend/ml:/app/ml
      - ./workers:/app/workers
      - backend_data:/app/data
      - ./data/videos:/app/data/videos
      - training_data:/app/data/training
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    command: /opt/venv/bin/celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q default,adi,detection,notification,prediction,maintenance
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A workers.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g

  # Sprint 15-16: YOLO fine-tuning uchun alohida worker (concurrency=1)
  celery_training:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-celery-training
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      ML_MODEL_PATH: "/app/ml/models"
      # YOLO26 — Ultralytics 2025-yil sentabr (NMS-free, 43% tezroq CPU)
      YOLO_MODEL: "yolo26n.pt"
      # Muzzle detection: custom trained best.pt
      MUZZLE_MODEL: "best.pt"
      MUZZLE_STRICT_MODE: "true"
      MUZZLE_CONFIDENCE_THRESHOLD: "0.40"
      TRAINING_FRAMES_DIR: "/app/data/training/frames"
      TRAINING_DATASETS_DIR: "/app/data/training/datasets"
      TRAINING_MODELS_DIR: "/app/data/training/models"
      TRAINING_BASE_MODEL_PATH: "/app/ml/models/yolo26n.pt"
      TRAINING_DEPLOY_MODEL_PATH: "/app/ml/models/yolo_custom.pt"
      PREDICTION_MODELS_DIR: "/app/ml/models/prediction"
      # ── Telegram Notification Bot ─────────────────────────────────────────
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      - ./backend/app:/app/app
      - ./backend/ml:/app/ml
      - ./workers:/app/workers
      - backend_data:/app/data
      - training_data:/app/data/training
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    command: /opt/venv/bin/celery -A workers.celery_app worker --loglevel=info --concurrency=1 -Q training -n training@%h
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A workers.celery_app inspect ping --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    memswap_limit: 3g

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    volumes:
      - ./backend/app:/app/app
      - ./workers:/app/workers
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    command: /opt/venv/bin/celery -A workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: taurus-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
      VITE_APP_NAME: "Taurus Vision"
      VITE_APP_VERSION: "0.1.0"
      BACKEND_URL: "http://backend:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # TELEGRAM ADMIN BOT — Tizim boshqaruvi
  # Notification botidan ALOHIDA servis
  # ─────────────────────────────────────────────
  telegram-admin-bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: taurus-admin-bot
    restart: unless-stopped
    environment:
      # ⚠️ .env faylida to'ldiring:
      ADMIN_BOT_TOKEN: ${ADMIN_BOT_TOKEN:-}
      ADMIN_ALLOWED_CHAT_IDS: ${ADMIN_ALLOWED_CHAT_IDS:-}
      BACKEND_URL: "http://taurus-backend:8000"
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-}
      # Har soatda avtomatik status xabari (true/false)
      HOURLY_STATUS_ENABLED: ${HOURLY_STATUS_ENABLED:-true}
      # Container holati tekshirish intervali (soniya)
      WATCH_INTERVAL_SEC: ${WATCH_INTERVAL_SEC:-60}
    volumes:
      # Docker socket — container boshqaruvi uchun ZARURIY
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # /proc — tizim resurslari (CPU, RAM) uchun
      - /proc:/proc:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import bot' 2>/dev/null && echo ok || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  taurus-network:
    driver: bridge
    name: taurus-network

volumes:
  postgres_data:
    name: taurus_postgres_data
  redis_data:
    name: taurus_redis_data
  backend_data:
    name: taurus_backend_data
  training_data:
    name: taurus_training_data
  frontend_node_modules:
    name: taurus_frontend_node_modules