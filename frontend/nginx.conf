server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # ── index.html — KESHLANMAYDI ─────────────────────────────────────────────
    # Har deploy keyin brauzer va Cloudflare yangi HTML olishi kerak.
    # Hashed JS/CSS linklari index.html ichida — shuning uchun HTML yangi bo'lishi shart.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── sw.js — ham keshlanmaydi ───────────────────────────────────────────────
    # Brauzer SW yangilanishini tekshirish uchun har safar serverdan oladi.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ── Hashed statik fayllar (JS, CSS) — 1 yil kesh ─────────────────────────
    # Vite barcha fayllarni hash bilan nomlaydi (assets/main-abc123.js)
    # Fayl o'zgarmasa URL o'zgarmaydi → kesh haqiqiy, xavfsiz
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Rasmlar va ikonlar ─────────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── React SPA — barcha yo'llar index.html ga ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
}