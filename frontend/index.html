<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- ── PWA Manifest ──────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme Colors ─────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#1E3EB4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E3EB4" media="(prefers-color-scheme: dark)" />

    <!-- ── iOS Safari PWA ───────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Taurus Vision" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- ── Android Chrome ───────────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Windows Tiles ────────────────────────────────────────────────── -->
    <meta name="msapplication-TileColor" content="#1E3EB4" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

    <!-- ── Favicons ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/icons/icon-96.png" />
    <link rel="shortcut icon" href="/taurus.png" />

    <!-- ── SEO ──────────────────────────────────────────────────────────── -->
    <title>Taurus Vision</title>
    <meta name="description" content="AI yordamida chorvachilik fermalarini real-time kuzatish, jonivorlarni identifikatsiya qilish va sog'liqni nazorat qilish tizimi." />
    <meta name="keywords" content="ferma monitoring, AI, chorvachilik, jonivorlar, YOLO, IoT sensor" />
    <meta name="author" content="Taurus Vision" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Open Graph ───────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Taurus Vision — AI Ferma Monitoringi" />
    <meta property="og:description" content="AI yordamida chorvachilik fermalarini real-time kuzatish tizimi." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- ── Fonts: async (render-blocking emas) ──────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <!-- ── Critical CSS: safe area inset (iPhone notch / Dynamic Island) ── -->
    <style>
      :root {
        --safe-area-top:    env(safe-area-inset-top,    0px);
        --safe-area-right:  env(safe-area-inset-right,  0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left:   env(safe-area-inset-left,   0px);
      }
      * { -webkit-tap-highlight-color: transparent; }
      html, body { overscroll-behavior-y: none; }
      body {
        padding-top: var(--safe-area-top);
        padding-left: var(--safe-area-left);
        padding-right: var(--safe-area-right);
      }
      /* Splash screen — app yuklanguncha */
      #tv-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #F7F8FA;
        display: grid; place-items: center;
        transition: opacity 0.3s ease;
      }
      #tv-splash.hidden { opacity: 0; pointer-events: none; }
      .tv-splash-logo {
        width: 72px; height: 72px;
        background: #1E3EB4; border-radius: 18px;
        display: grid; place-items: center;
        animation: tv-pulse 1.6s ease-in-out infinite;
      }
      @keyframes tv-pulse {
        0%, 100% { transform: scale(1);    opacity: 1; }
        50%       { transform: scale(0.95); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="tv-splash">
      <div class="tv-splash-logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="6" width="20" height="13" rx="2.5" stroke="white" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="3.5" stroke="white" stroke-width="1.5"/>
          <path d="M8 6L9.5 3h5L16 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="19" cy="9" r="1.2" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Main app -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Service Worker Registration ──────────────────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[SW] Registered:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', () => {
                  if (
                    newWorker.state === 'installed' &&
                    navigator.serviceWorker.controller
                  ) {
                    console.log('[SW] Yangi versiya mavjud. Sahifani yangilang.');
                  }
                });
              });
            })
            .catch((err) => console.warn('[SW] Registration failed:', err));
        });
      }

      // Splash screen yashirish (React mounted bo'lganda)
      document.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('tv-splash');
        if (!splash) return;
        setTimeout(() => {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 350);
        }, 400);
      });
    </script>
  </body>
</html>
