# ============================================================
# Taurus Vision — Server override (zxzx.uz)
# ============================================================
#
# FOYDALANISH (server da):
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# BU FAYL NIMA QILADI:
#   - HMR ni HTTPS / WSS rejimga o'tkazadi (port 443)
#   - Vite proksi BACKEND_URL ni Docker tarmog'iga moslashtiradi
#
# LOKAL MASHINADA bu faylni ISHLATMANG.
# ============================================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: taurus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - taurus-network

  frontend:
    environment:
      VITE_HMR_CLIENT_PORT: "80"
      BACKEND_URL: "http://backend:8000"