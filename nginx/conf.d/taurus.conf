# ============================================================
# Taurus Vision — Virtual Host Configuration
# ============================================================

# ── HTTP → HTTPS Redirect (production) ───────────────────────
# Development uchun bu blokni o'chirib qo'ying
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# ── Main Server Block ─────────────────────────────────────────
server {
    listen 80;
    # Production uchun:
    # listen 443 ssl http2;
    server_name localhost;

    # SSL (production uchun uncomment qiling)
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    client_max_body_size 50M;  # Kamera suratlari uchun

    # ── Health Check (Nginx o'zi) ──────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Backend API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # Buffering — katta javoblar uchun o'chirish
        proxy_buffering off;
    }

    # ── WebSocket ─────────────────────────────────────────────
    location /ws {
        limit_conn ws_conn 5;   # IP boshiga 5 ta WS ulanish

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # WebSocket uzun ulanish uchun timeout oshiramiz
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Backend Docs (development only) ───────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
    }

    # ── Backend Health ────────────────────────────────────────
    location /health {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Prometheus Metrics (internal only) ───────────────────
    # Faqat ichki tarmoqdan ruxsat
    location /metrics {
        allow 172.0.0.0/8;   # Docker network
        allow 127.0.0.1;
        deny  all;

        proxy_pass       http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Frontend ──────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;

        # Vite HMR WebSocket (development)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}