# ============================================================
# Taurus Vision — Nginx Main Configuration
# ============================================================

user nginx;
worker_processes auto;          # CPU yadrolar soni
worker_rlimit_nofile 65535;     # Ochiq fayllar limiti

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────
    log_format main_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"req_time":$request_time,'
            '"remote":"$remote_addr",'
            '"ref":"$http_referer",'
            '"ua":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main_json;

    # ── Performance ───────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Security Headers (global) ─────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Rate Limiting Zones ───────────────────────────────
    # API uchun: IP boshiga 30 req/s
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Auth uchun: IP boshiga 5 req/min (brute-force himoya)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # WebSocket uchun: IP boshiga 10 ulanish
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ── Upstream Servers ──────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    # ── Include Virtual Hosts ─────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}