# ============================================================
# Taurus Vision — PostgreSQL Production Configuration
# 7.5 GB RAM, CPU-only server uchun optimallashtirilgan
# ============================================================

# --- Connection Settings ---
max_connections = 100               # Backend 4 workers * ~20 = 80 max

# --- Memory Settings (7.5 GB RAM ga moslashtirilgan) ---
shared_buffers = 512MB              # RAM ning ~25%
effective_cache_size = 2GB          # RAM ning ~60-70%
work_mem = 16MB                     # per-sort/hash operation
maintenance_work_mem = 128MB        # VACUUM, CREATE INDEX uchun

# --- Write-Ahead Log (WAL) ---
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_level = replica                 # Minimal, replica uchun tayyor

# --- Query Planner ---
random_page_cost = 1.1              # SSD uchun (HDD = 4.0)
effective_io_concurrency = 200      # SSD uchun

# --- Logging ---
log_min_duration_statement = 1000   # 1+ soniya so'rovlarni log qilish
log_line_prefix = '%t [%p]: '
log_timezone = 'UTC'

# --- Locale ---
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'