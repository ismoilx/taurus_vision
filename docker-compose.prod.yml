# ============================================================
# Taurus Vision — Production Docker Compose
# ============================================================
# Ishlatish:
#   cp .env.example .env
#   # .env faylini tahrirlang
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ── PostgreSQL (production tuning) ─────────────────────────
  postgres:
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Production PostgreSQL config
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    ports: []          # Production da port ochmaymiz
    networks:
      - taurus-internal

  # ── Redis (production) ──────────────────────────────────────
  redis:
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:-}
    ports: []          # Tashqariga ochmang
    networks:
      - taurus-internal

  # ── Backend (production) ───────────────────────────────────
  backend:
    environment:
      DEBUG:        "false"
      APP_VERSION:  ${APP_VERSION:-1.0.0}
      SECRET_KEY:   ${SECRET_KEY}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://redis:6379/0"
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      LOG_FORMAT:   json
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app
          --host 0.0.0.0
          --port 8000
          --workers 4
          --worker-class uvicorn.workers.UvicornWorker
          --access-log
          --log-level info
      "
    ports: []          # Nginx orqali
    networks:
      - taurus-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Celery Worker (production) ─────────────────────────────
  celery_worker:
    environment:
      DATABASE_URL:           "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:              "redis://redis:6379/0"
      CELERY_BROKER_URL:      "redis://redis:6379/0"
      CELERY_RESULT_BACKEND:  "redis://redis:6379/1"
      LOG_LEVEL:              ${LOG_LEVEL:-INFO}
    networks:
      - taurus-internal
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Celery Beat (production) ───────────────────────────────
  celery_beat:
    environment:
      DATABASE_URL:           "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:              "redis://redis:6379/0"
      CELERY_BROKER_URL:      "redis://redis:6379/0"
      CELERY_RESULT_BACKEND:  "redis://redis:6379/1"
    networks:
      - taurus-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (production build) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL:  ""         # Nginx orqali — relative URL
        VITE_WS_URL:   ""
    environment:
      VITE_API_URL: ""
      VITE_WS_URL:  ""
    ports: []          # Nginx orqali
    networks:
      - taurus-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"

  # ── Nginx (production) ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: taurus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      # SSL sertifikatlar (Let's Encrypt)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - taurus-internal
      - taurus-external
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: taurus-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # Faqat localhost dan
    networks:
      - taurus-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: taurus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL:               warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"   # Faqat localhost dan
    depends_on:
      - prometheus
    networks:
      - taurus-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"

# ── Networks ──────────────────────────────────────────────────
networks:
  taurus-internal:
    driver: bridge
    name: taurus-internal
    internal: true    # Internet ga to'g'ridan chiqish yo'q

  taurus-external:
    driver: bridge
    name: taurus-external

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    name: taurus_postgres_data
  redis_data:
    name: taurus_redis_data
  backend_data:
    name: taurus_backend_data
  prometheus_data:
    name: taurus_prometheus_data
  grafana_data:
    name: taurus_grafana_data
  nginx_logs:
    name: taurus_nginx_logs
  frontend_node_modules:
    name: taurus_frontend_node_modules