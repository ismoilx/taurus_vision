# ============================================================================
# Taurus Vision - Full Stack Orchestration
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: taurus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taurus
      POSTGRES_PASSWORD: taurus123
      POSTGRES_DB: taurus_vision
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taurus -d taurus_vision"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taurus-network

  redis:
    image: redis:7-alpine
    container_name: taurus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taurus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-backend
    restart: unless-stopped
    environment:
      APP_NAME: "Taurus Vision API"
      APP_VERSION: "0.1.0"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "https://zxzx.uz", "https://api.zxzx.uz"]'
      SECRET_KEY: "taurus-vision-dev-secret-change-in-production-2024"
      INITIAL_ADMIN_EMAIL: "admin@taurus.uz"
      INITIAL_ADMIN_USERNAME: "admin"
      INITIAL_ADMIN_PASSWORD: "Admin1234"
      INITIAL_ADMIN_FULLNAME: "System Administrator"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/ml:/app/ml
      - ./backend/tests:/app/tests
      - backend_data:/app/data
      # Sprint 6: Test video fayllari uchun mount
      - ./data/videos:/app/data/videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - taurus-network
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    mem_limit: 2g
    memswap_limit: 2g

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    volumes:
      - ./backend/app:/app/app
      - ./backend/ml:/app/ml
      - ./workers:/app/workers
      - backend_data:/app/data
      - ./data/videos:/app/data/videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    command: /opt/venv/bin/celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q default,adi,alerts,maintenance
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A workers.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taurus-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://taurus:taurus123@postgres:5432/taurus_vision"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    volumes:
      - ./backend/app:/app/app
      - ./workers:/app/workers
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    command: /opt/venv/bin/celery -A workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: taurus-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taurus-network
    stdin_open: true
    tty: true

networks:
  taurus-network:
    driver: bridge
    name: taurus-network

volumes:
  postgres_data:
    name: taurus_postgres_data
  redis_data:
    name: taurus_redis_data
  backend_data:
    name: taurus_backend_data
  frontend_node_modules:
    name: taurus_frontend_node_modules