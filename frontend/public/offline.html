<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1E3EB4">
  <title>Taurus Vision — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F7F8FA;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      border: 1px solid #E4E7ED;
    }
    .logo {
      width: 56px; height: 56px;
      background: #1E3EB4;
      border-radius: 14px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6B7280;
      margin-bottom: 32px;
      font-family: 'JetBrains Mono', monospace;
    }
    .icon-wrap {
      width: 72px; height: 72px;
      background: #FEF2F2;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #0D1117;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1E3EB4;
      color: white;
      border: none;
      padding: 13px 32px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }
    .retry-btn:hover  { background: #1a35a0; }
    .retry-btn:active { transform: scale(0.97); }
    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="6" width="20" height="13" rx="2.5" stroke="white" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3.5" stroke="white" stroke-width="1.5"/>
        <path d="M8 6L9.5 3h5L16 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18.5" cy="9.5" r="1" fill="white"/>
      </svg>
    </div>
    <div class="brand">TAURUS VISION</div>

    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round">
        <path d="M1 6l4-4 14 14-4 4z"/>
        <path d="M17.5 6.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
        <line x1="7" y1="1" x2="1" y2="7"/>
      </svg>
    </div>

    <h1>Internet aloqasi yo'q</h1>
    <p>
      Taurus Vision serveriga ulanib bo'lmayapti.<br>
      Internet aloqangizni tekshiring va qayta urinib ko'ring.
    </p>

    <button class="retry-btn" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M23 4v6h-6"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Qayta urinish
    </button>

    <p class="hint">
      Oldindan yuklangan ma'lumotlar mavjud bo'lsa,<br>
      ular sahifada ko'rsatiladi.
    </p>
  </div>
</body>
</html>
